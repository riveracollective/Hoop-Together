S.settings=Object.assign({},DEFAULT.settings,S.settings||{});S.who='kid';S.shots=S.shots||{};

const PF=['plan','logs','shots','gear'];
function newProfile(name,kind){return {id:'p'+Math.random().toString(36).slice(2,8),name,kind,plan:['breathe','pound','figure8','wallpass','form','free'],logs:[],shots:{},gear:null,playerId:null}}
function initProfiles(){
  if(!S.profiles||!S.profiles.length){
    if(S.logs&&S.logs.length){const coach=newProfile(S.names.dad||'Coach','coach');coach.plan=[...DEFAULT.plan];
    const kid=newProfile(S.names.kid||'Player','player');kid.plan=S.plan||kid.plan;kid.logs=S.logs||[];kid.shots=S.shots||{};kid.gear=S.gear||null;
    S.profiles=[coach,kid];S.active=coach.id;}
    else{const me=newProfile('Coach','coach');me.plan=[...DEFAULT.plan];S.profiles=[me];S.active=me.id;S.needsSetup=true}
  }
  if(!S.profiles.find(p=>p.id===S.active))S.active=S.profiles[0].id;
  if(S.settings.device==='player'){const d=S.profiles.find(p=>p.id===S.settings.deviceProfile)||S.profiles.find(p=>p.kind==='player');if(d)S.active=d.id}
  loadProfile();
}
function curProfile(){return S.profiles.find(p=>p.id===S.active)}
function loadProfile(){const p=curProfile();PF.forEach(k=>S[k]=p[k]);if(!S.plan)S.plan=[];if(!S.logs)S.logs=[];if(!S.shots)S.shots={};p.plan=S.plan;p.logs=S.logs;p.shots=S.shots}
function syncProfile(){const p=curProfile&&S.profiles&&curProfile();if(p)PF.forEach(k=>p[k]=S[k])}
function pname(){const p=curProfile();return p?p.name:'Player'}
function coachProfile(){return S.profiles.find(p=>p.kind==='coach')||S.profiles[0]}
function switchProfile(id){syncProfile();S.active=id;loadProfile();save();buildNav();render();toast('Training as '+pname())}
function serialize(){syncProfile();const o={...S};PF.forEach(k=>delete o[k]);return JSON.stringify(o)}
function save(){try{localStorage.setItem(KEY,serialize())}catch(e){}}
initProfiles();

  S.settings.layout='pro';

  document.body.classList.toggle('lite',day&&!pro);
  try{buildNav()}catch(e){}
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).getPropertyValue('--bg').trim()||'#141a33';

let AC;
function chime(freq=660,len=.18,times=1){
  if(!S.settings.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();

      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+len+.35)}}catch(e){}
}

      else s+=`<g transform="translate(${m.at[0]},${m.at[1]})">${tok}</g>`});return s+'</svg>'}
  (g.cones||[]).forEach(c=>s+=cone(c[0],c[1]));

  }
  return s+'</svg>';
}

  const stroke=kind==='ghost'?'var(--ink)':'#1b1f2b';const dash=kind==='ghost'?'stroke-dasharray="3 3" opacity=".55"':'';

  const glow=kind==='pivot'?`<circle r="30" fill="var(--orange)" opacity=".18"/>`:'';

const still=()=>S.settings.still;
function aMove(x1,y1,r1,x2,y2,r2,dur=3){ // returns wrapper for a foot that steps from A to B and back

}
function movingFoot(side,x1,y1,r1,x2,y2,r2,kind,dur){
  const a=aMove(x1,y1,r1,x2,y2,r2,dur);

function pivotFoot(side,x,y,r,cx,cy,deg,dur=3.2){

const HEADS={handle:['Own Your','Handle'],shoot:['Find Your','Rhythm'],feet:['Win With','Footwork'],d:['Lock In On','Defense'],pass:['Make the','Extra Pass'],fit:['Build Your','Engine'],calm:['Breathe and','Play']};
function closePct(){let m=0,a=0;Object.values(S.shots).forEach(d=>{if(d.close){m+=d.close[0];a+=d.close[1]}});return a?Math.round(m/a*100):null}
function proHero(total){
  const cnt={};S.plan.forEach(id=>{const c=DM[id]&&DM[id].cat;if(c&&c!=='calm')cnt[c]=(cnt[c]||0)+1});
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'handle';const h=HEADS[top];
  const cp=closePct();const still=S.settings.still;
  // Around the world: shoot from 5 spots around the key. Hero viewBox 390x470, rim at (195,147).
  const RIM=[195,140],RR=72,ANG=[12,51,90,129,168],T=12;
  const SP=ANG.map(a=>[RIM[0]+RR*Math.cos(a*Math.PI/180),RIM[1]+RR*Math.sin(a*Math.PI/180)]);
  const pl=a=>a.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const len=a=>a.reduce((t,q,i)=>i?t+Math.hypot(q[0]-a[i-1][0],q[1]-a[i-1][1]):0,0);
  const arcPts=(a0,a1)=>{const o=[];for(let k=0;k<=10;k++){const a=(a0+(a1-a0)*k/10)*Math.PI/180;o.push([RIM[0]+RR*Math.cos(a),RIM[1]+RR*Math.sin(a)])}return o};
  let pP=[SP[0]];for(let k=0;k<4;k++)pP=pP.concat(arcPts(ANG[k],ANG[k+1]).slice(1));
  const pKT=[0],pKP=[0];for(let k=0;k<5;k++){const t0=k*2/T;if(k){pKT.push(t0);pKP.push(k/4)}pKT.push((k*2+1.2)/T);pKP.push(k/4);if(k<4){}}
  pKT.push(1);pKP.push(1);
  const shotPts=q=>{const o=[];const c=[(q[0]+RIM[0])/2,Math.min(q[1],RIM[1])-58];for(let k=0;k<=12;k++){const t=k/12,u=1-t;o.push([u*u*q[0]+2*u*t*c[0]+t*t*RIM[0],u*u*q[1]+2*u*t*c[1]+t*t*RIM[1]])}return o};
  let bP=[SP[0]],segs=[];
  for(let k=0;k<5;k++){const sh=shotPts(SP[k]);bP=bP.concat(sh.slice(1));segs.push(len(sh));if(k<4){const rb=[RIM,SP[k+1]];bP=bP.concat([SP[k+1]]);segs.push(len(rb))}}
  const btot=segs.reduce((a,b)=>a+b,0);let acc=0;const bKT=[0],bKP=[0];
  for(let k=0;k<5;k++){const t0=k*2/T;bKT.push(t0+.35/T);bKP.push(acc/btot);acc+=segs[k*2];bKT.push(t0+1/T);bKP.push(acc/btot);if(k<4){acc+=segs[k*2+1];bKT.push(t0+2/T-.02/T);bKP.push(acc/btot)}}
  bKT.push(1);bKP.push(1);
  const fx=a=>a.map(v=>(+v).toFixed(4)).join(';');
  const spotArc=pl(arcPts(ANG[0],ANG[4]));
  const an=(x)=>still?'':x;
  return `<section class="prohero" aria-label="Today's session">
  <svg class="bg" viewBox="0 0 390 470" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><radialGradient id="phg" cx="55%" cy="30%" r="85%"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#070707"/></radialGradient><filter id="phb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="phf" x1="0" y1="0" x2="0" y2="1"><stop offset=".4" stop-color="#070707" stop-opacity="0"/><stop offset=".78" stop-color="#070707" stop-opacity=".9"/><stop offset="1" stop-color="#070707"/></linearGradient></defs>
  <rect width="390" height="470" fill="url(#phg)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5" transform="translate(0 88)"><rect x="20" y="20" width="350" height="440" rx="6"/><rect x="135" y="20" width="120" height="150"/><circle cx="195" cy="170" r="48"/><path d="M40 20 V100 A160 160 0 0 0 350 100 V20"/><circle cx="195" cy="52" r="12"/></g>
  <path d="${spotArc}" fill="none" stroke="#FF5A1F" stroke-width="10" stroke-linecap="round" filter="url(#phb)" opacity=".45"/>
  <path d="${spotArc}" fill="none" stroke="#FF7A3D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/>
  ${SP.map((q,i)=>`<g transform="translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})"><circle r="8" fill="#070707" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/><text y="4" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="11" fill="#fff">${i+1}</text></g>`).join('')}
  <g ${still?`transform="translate(${SP[0][0].toFixed(1)} ${SP[0][1].toFixed(1)})"`:''}><g><circle r="13" fill="#fff"/><text y="5.5" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="15" fill="#070707">1</text></g>${an(`<animateMotion dur="${T}s" repeatCount="indefinite" keyPoints="${fx(pKP)}" keyTimes="${fx(pKT)}" calcMode="linear" path="${pl(pP)}"/>`)}</g>
  <g ${still?`transform="translate(${RIM[0]} ${RIM[1]})"`:''}><circle r="7" fill="#FF5A1F" stroke="#070707" stroke-width="2"/>${an(`<animateMotion dur="${T}s" repeatCount="indefinite" keyPoints="${fx(bKP)}" keyTimes="${fx(bKT)}" calcMode="linear" path="${pl(bP)}"/>`)}</g>
  <rect width="390" height="470" fill="url(#phf)"/></svg>
  <div class="wm" role="img" aria-label="Hoop Together">HOOP<span class="wmball" aria-hidden="true"></span><br>TOGETHER</div>
  <div class="ov">
   <div class="herolbl">${curProfile().kind==='coach'?'Today':esc(pname())+"'s plan"} · ${esc(h[0])} ${esc(h[1])}</div>
   <div style="display:flex;gap:22px">

    <div><div class="stat" style="font-size:2.6em">${String(S.plan.length).padStart(2,'0')}</div><div class="statl">DRILLS</div></div>
    <div><div class="stat" style="font-size:2.6em">${cp==null?totalMakes():cp+'<span style="font-size:.5em">%</span>'}</div><div class="statl">${cp==null?'MAKES':'CLOSE SHOTS'}</div></div>
   </div>
   
   <div style="display:flex;gap:14px;margin-top:6px;align-items:center"><button class="pill w herocta" id="heroStart">Start session</button><button class="herolink" id="heroPlan">See plan</button></div>
  </div></section>`;

function dailyPick(){

let skipPop=false;let SHP=null,profParent=null;
function openSheet(html){const s=$('#sheet');$('#sheetInner').innerHTML=html;if(!s.classList.contains('open')){try{history.pushState({sheet:1},'')}catch(_){}}s.classList.add('open');s.scrollTop=0;document.body.style.overflow='hidden';
  const par=SHP;SHP=null;s.querySelectorAll('[data-close]').forEach(b=>{if(par){b.onclick=()=>par();b.setAttribute('aria-label','Back')}else b.onclick=()=>closeSheet()});s.querySelectorAll('[data-skl]').forEach(b=>b.onclick=()=>{closeSheet();setTimeout(()=>openSkill(b.dataset.skl),250)})}
function closeSheet(fromPop){const wasOpen=$('#sheet').classList.contains('open');clearInterval(RX.int);RX.int=null;$('#sheet').classList.remove('open','prolive');document.body.style.overflow='';try{stopSession(true)}catch(_){}
  if(wasOpen&&fromPop!==true){try{if(history.state&&history.state.sheet){skipPop=true;history.back()}}catch(_){}}}
window.addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}if($('#sheet').classList.contains('open'))closeSheet(true);else if(P&&P.full){P.full=false;document.body.classList.remove('pbfull');const c=$('#pbCard');if(c)c.classList.remove('full')}});

/* ---------- ring helper ---------- */
const RING_C=2*Math.PI*88;
function ringSVG(){return `<div class="ringwrap"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--card2)" stroke-width="16"/><circle id="ringFg" cx="100" cy="100" r="88" fill="none" stroke="var(--teal)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg><div class="ringtxt"><div class="t" id="ringT">0:00</div><div class="l" id="ringL"></div></div></div>`}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function setRing(frac,secs,label,color){const f=$('#ringFg');if(!f)return;f.style.strokeDashoffset=RING_C*(1-frac);f.style.stroke=color;$('#ringT').textContent=fmt(secs);$('#ringL').textContent=label}
let wake=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen')}else if(wake){await wake.release();wake=null}}catch(e){}}

function drawSes(){
  const frac=SES.total?SES.left/SES.total:0;
  const col=SES.left<=30?'var(--warn)':'var(--teal)';
  setRing(frac,SES.left,SES.left<=0?'Time! Tap Done':SES.left<=30?'Almost done':SES.running?'Go!':'Ready?',col);
  const pt=$('#proT');if(pt){pt.textContent=fmt(SES.left);pt.style.color=SES.left<=30?'#FF5A1F':'#fff';$('#proL').textContent=SES.left<=0?'TIME! TAP DONE':SES.left<=30?'ALMOST DONE':'TIME LEFT';$('#proBar').style.width=(frac*100)+'%'}
  const p=$('#play');if(p)p.textContent=SES.running?'❚❚ Pause':'▶ '+(SES.left<SES.total?'Keep going':'Start');
}
function toggleSes(){
  SES.running=!SES.running;
  if(SES.running){SES.last=performance.now();chime(520);SES.int=setInterval(tickSes,200)}else clearInterval(SES.int);
  drawSes();
}
function tickSes(){
  const now=performance.now();SES.left-=(now-SES.last)/1000;SES.last=now;
  if(!SES.warned&&SES.left<=30&&SES.total>45){SES.warned=true;chime(600);buzz(120)}
  if(SES.left<=0){SES.left=0;SES.running=false;clearInterval(SES.int);chime(780,.25,3);buzz([200,100,200])}
  drawSes();
}
function nextDrill(){
  clearInterval(SES.int);SES.done.push(S.plan[SES.i]);chime(880,.15);
  SES.i++;if(SES.i>=S.plan.length)return finishSession();
  // short transition card
  const d=DM[S.plan[SES.i]];
  $('#ses').innerHTML=`<div class="celebrate pop"><div class="big"></div><h2>Nice work!</h2><p class="muted">Get a sip of water.</p>
   <div class="next" style="justify-content:center"><span class="muted small">Next up</span><span class="emoji">${catOf(d.cat).e}</span><b>${esc(d.name)}</b></div>

}

/* ---------- TIMER ---------- */
const T={work:60,rest:0,rounds:1,phase:'work',round:1,left:60,running:false,int:null,last:0};
function renderTimer(v){
  setTimeout(()=>{const a=$('#esStart');if(a)a.onclick=()=>{go('today');setTimeout(()=>{const b=$('#heroStart');if(b)b.click()},150)};const c=$('#esShots');if(c)c.onclick=()=>{const el=document.querySelector('#shotCard,.shotcard,[data-spot]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}},0);
  if(!T.running&&!T.int){T.phase='work';T.round=1;T.left=T.work}
  const fresh=!S.logs.length&&!Object.keys(S.shots||{}).length;
  v.innerHTML=(isPro()&&fresh?`<div class="card emptyst"><div class="herolbl2">Nothing logged yet</div><h2 style="margin:4px 0 6px">Your numbers start here</h2><p class="muted small" style="margin:0 0 12px">Finish a session or count some shots and your makes, streak and shot chart fill in automatically.</p><div class="row" style="gap:10px"><button class="btn primary grow" id="esStart">Start today's session</button><button class="btn" id="esShots">Count shots</button></div></div>`:'')+(isPro()?proStats():'')+`<div class="card">${ringSVG()}
   <div class="row" style="gap:8px"><button class="btn primary grow" id="tPlay">▶ Start</button><button class="btn" id="tReset">↺ Reset</button></div></div>
   <div class="card"><h2>Quick set</h2><div class="chips">${[[30,'30 sec'],[60,'1 min'],[120,'2 min'],[300,'5 min'],[600,'10 min']].map(q=>`<button class="chip" data-q="${q[0]}">${q[1]}</button>`).join('')}</div>
   <div class="chips">${[['20/20 ×6',20,20,6],['30/30 ×4',30,30,4],['45/15 ×5',45,15,5]].map(q=>`<button class="chip" data-iv="${q[1]},${q[2]},${q[3]}">${q[0]}</button>`).join('')}</div>
   <div class="stepper"><span>Work</span><button data-s="work,-15">−</button><b id="sWork">${fmt(T.work)}</b><button data-s="work,15">+</button></div>
   <div class="stepper"><span>Rest</span><button data-s="rest,-5">−</button><b id="sRest">${fmt(T.rest)}</b><button data-s="rest,5">+</button></div>
   <div class="stepper"><span>Rounds</span><button data-s="rounds,-1">−</button><b id="sRounds">${T.rounds}</b><button data-s="rounds,1">+</button></div>
   <p class="muted small">Teal = go. Yellow = last 5 seconds. Violet = rest. A chime plays at each change${S.settings.vibe?' and the phone buzzes':''}.</p></div>
   ${shotHTML()}
   <div class="card"><h2>Colour reaction</h2><p class="muted small" style="margin:0 0 8px">Dribble and react to the colour. Green = right hand · Blue = left · Yellow = crossover · Red = jump stop.</p>
    <div class="chips">${[[4,'Slow'],[3,'Medium'],[2,'Fast']].map(q=>`<button class="chip ${RX.every===q[0]?'on':''}" data-rx="${q[0]}">${q[1]}</button>`).join('')}</div>
    <button class="btn orange block" id="rxGo">▶ Start 1 minute</button></div>`;
  drawT();
  bindShots(v);
  v.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{RX.every=+b.dataset.rx;render()});
  $('#rxGo').onclick=()=>{openSheet('<div id="rxw"></div>');runReaction($('#rxw'),60,closeSheet)};
  $('#tPlay').onclick=()=>{T.running=!T.running;if(T.running){T.last=performance.now();chime(520);keepAwake(true);T.int=setInterval(tickT,200)}else{clearInterval(T.int);T.int=null;keepAwake(false)}drawT()};
  $('#tReset').onclick=()=>{clearInterval(T.int);T.int=null;T.running=false;T.phase='work';T.round=1;T.left=T.work;keepAwake(false);drawT()};
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{T.work=+b.dataset.q;T.rest=0;T.rounds=1;resetT()});
  v.querySelectorAll('[data-iv]').forEach(b=>b.onclick=()=>{const [w,r,n]=b.dataset.iv.split(',').map(Number);T.work=w;T.rest=r;T.rounds=n;resetT()});
  v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const [k,dv]=b.dataset.s.split(',');T[k]=Math.max(k==='rounds'?1:k==='rest'?0:5,T[k]+Number(dv));resetT()});
}
function resetT(){clearInterval(T.int);T.int=null;T.running=false;T.phase='work';T.round=1;T.left=T.work;render()}
function drawT(){
  const tot=T.phase==='work'?T.work:T.rest;
  const col=T.phase==='rest'?'var(--violet)':T.left<=5?'var(--warn)':'var(--teal)';
  const lbl=T.phase==='done'?'All done! ':(T.phase==='rest'?'Rest':'Go!')+(T.rounds>1?` · round ${T.round}/${T.rounds}`:'');
  setRing(T.phase==='done'?0:T.left/tot,T.left,lbl,col);
  const p=$('#tPlay');if(p)p.textContent=T.running?'❚❚ Pause':'▶ Start';
  const a=$('#sWork'),b=$('#sRest'),c=$('#sRounds');if(a){a.textContent=fmt(T.work);b.textContent=fmt(T.rest);c.textContent=T.rounds}
}
function tickT(){
  const now=performance.now();const before=T.left;T.left-=(now-T.last)/1000;T.last=now;
  if(T.phase==='work'&&before>5&&T.left<=5&&T.work>10)chime(600,.1);
  if(T.left<=0){
    if(T.phase==='work'&&T.rest>0&&T.round<T.rounds){T.phase='rest';T.left=T.rest;chime(440,.2,2);buzz(150)}
    else if(T.round<T.rounds){T.round++;T.phase='work';T.left=T.work;chime(660,.2,2);buzz(150)}
    else{T.phase='done';T.left=0;T.running=false;clearInterval(T.int);T.int=null;chime(780,.25,3);buzz([200,100,200]);keepAwake(false)}
  }
  if(tab==='timer')drawT();
}

function proStats(){
  const tot={};Object.values(S.shots).forEach(d=>Object.entries(d).forEach(([k,v])=>{tot[k]=tot[k]||[0,0];tot[k][0]+=v[0];tot[k][1]+=v[1]}));
  const cp=closePct();const wk=(()=>{const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);mon.setHours(0,0,0,0);return new Set(S.logs.filter(l=>new Date(l.date+'T12:00')>=mon).map(l=>l.date)).size})();
  const pos={close:[171,62],left:[56,132],mid:[171,176],right:[286,132],ft:[171,118]};

function runReaction(box,secs,done){
  let left=secs,last=-1,next=0;const t0=performance.now();
  box.innerHTML=`<div id="rxScr" style="border-radius:24px;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);transition:background .15s;color:#10152b;text-align:center;padding:20px">
    <div id="rxSym" style="font-size:5em;line-height:1;font-weight:700">3</div><div id="rxTxt" style="font-size:1.8em;font-weight:700;margin-top:10px;color:var(--text)">Get ready…</div></div>
   <div class="row" style="margin-top:12px"><div class="grow muted" id="rxLeft">${fmt(secs)}</div><button class="btn" id="rxStop">■ Stop</button></div>`;
  const stop=()=>{clearInterval(RX.int);RX.int=null;keepAwake(false);done&&done()};
  $('#rxStop').onclick=stop;keepAwake(true);
  let count=3;
  const cd=setInterval(()=>{count--;const sym=$('#rxSym');if(!sym){clearInterval(cd);return}if(count>0){sym.textContent=count;chime(520,.08)}else{clearInterval(cd);go1()}},800);
  const go1=()=>{const start=performance.now();
    RX.int=setInterval(()=>{const el=$('#rxScr');if(!el){clearInterval(RX.int);return}
      const e=(performance.now()-start)/1000;left=secs-e;$('#rxLeft').textContent=fmt(left)+' left';
      if(e>=next){let i;do{i=Math.floor(Math.random()*RXC.length)}while(i===last);last=i;next=e+RX.every;
        el.style.background=RXC[i][0];$('#rxSym').textContent=RXC[i][2];$('#rxTxt').textContent=RXC[i][1];$('#rxTxt').style.color='#10152b';chime(600+i*90,.1);buzz(60)}
      if(left<=0){clearInterval(RX.int);RX.int=null;chime(780,.25,3);buzz([200,100,200]);el.style.background='var(--card)';$('#rxSym').textContent='';$('#rxTxt').textContent='Done!';$('#rxTxt').style.color='var(--text)';keepAwake(false);
        $('#rxStop').textContent='✓ Back';}
    },150)};
}

function pmode(){return P.mode||((P.cur.frames||[]).length>1?'watch':'draw')}
function hist(){P.hist.push(JSON.stringify(P.cur));if(P.hist.length>40)P.hist.shift()}
function addTok(t){
  hist();const same=P.cur.tokens.filter(k=>k.t===t);
  if(t==='b'&&same.length){toast('Only one ball');P.hist.pop();return}
  const n=String(same.length+1);const id=t+Date.now().toString(36);
  const spots={o:[[150,215],[240,150],[60,150],[245,50],[55,50]],x:[[150,190],[225,138],[75,138],[225,60],[75,60]]};
  const sp=t==='b'?[175,215]:(spots[t][same.length%5]);

}
function tokSVG(k){
  if(k.t==='b')return `<g data-id="${k.id}" transform="translate(${k.x},${k.y})"><circle r="14" fill="transparent"/><circle r="8" fill="var(--orange)" stroke="#5a2a00"/></g>`;
  const inner=k.t==='o'?oTok(0,0,k.n):xTok(0,0,k.n);
  return `<g data-id="${k.id}" transform="translate(${k.x},${k.y})"><circle r="20" fill="transparent"/>${inner}</g>`;
}
function lineSVG(l,i){
  if(l.k==='pen'){const pts=(l.pts||[]).map(p=>p.join(',')).join(' ');return `<g ${i!=null?`data-line="${i}"`:''}><polyline points="${pts}" stroke="transparent" stroke-width="18" fill="none"/><polyline points="${pts}" stroke="var(--orange)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pbm)"/></g>`}
  const {x1,y1,x2,y2,k}=l;const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
  let vis='';const st='stroke="var(--ink)" stroke-width="2.5" fill="none" stroke-linecap="round"';
  if(k==='cut')vis=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st} marker-end="url(#pbm)"/>`;
  else if(k==='pass')vis=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st} stroke-dasharray="7 6" marker-end="url(#pbm)"/>`;
  else if(k==='screen')vis=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st}/><line x1="${x2+px*9}" y1="${y2+py*9}" x2="${x2-px*9}" y2="${y2-py*9}" ${st} stroke-width="3.5"/>`;
  else{let pts=[[x1,y1]];const seg=9,n=Math.max(2,Math.floor((L-12)/seg));for(let j=1;j<=n;j++){const s=j*seg,o=(j%2?6:-6);pts.push([x1+ux*s+px*o,y1+uy*s+py*o])}pts.push([x2,y2]);
    vis=`<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" ${st} stroke-linejoin="round" marker-end="url(#pbm)"/>`}
  return `<g ${i!=null?`data-line="${i}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="18"/>${vis}</g>`;
}
function drawPB(){
  const L=$('#pLines'),K=$('#pToks');if(!L)return;
  L.innerHTML=P.anim?'':P.cur.lines.map((l,i)=>lineSVG(l,i)).join('');
  K.innerHTML=P.cur.tokens.map(tokSVG).join('');
}
function svgPt(e){const pb=$('#pb');const p=pb.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(pb.getScreenCTM().inverse());return {x:Math.max(4,Math.min(296,r.x)),y:Math.max(2,Math.min(pbH()-4,r.y))}}
function pbDown(e){
  if(P.anim||pmode()==='watch')return;const p=svgPt(e);const g=e.target.closest('[data-id]');const ln=e.target.closest('[data-line]');
  if(P.tool==='erase'){
    if(g){hist();P.cur.tokens=P.cur.tokens.filter(t=>t.id!==g.dataset.id);drawPB()}
    else if(ln){hist();P.cur.lines.splice(+ln.dataset.line,1);drawPB()}
    return;
  }
  if(P.tool==='move'){if(g){hist();const t=P.cur.tokens.find(t=>t.id===g.dataset.id);P.drag={t,el:g,dx:p.x-t.x,dy:p.y-t.y};$('#pb').setPointerCapture(e.pointerId)}return}
  if(P.tool==='pen'){P.draft={k:'pen',pts:[[Math.round(p.x),Math.round(p.y)]]};$('#pb').setPointerCapture(e.pointerId);return}
  let s=p;if(g){const t=P.cur.tokens.find(t=>t.id===g.dataset.id);s={x:t.x,y:t.y}}
  P.draft={k:P.tool,x1:s.x,y1:s.y,x2:p.x,y2:p.y};$('#pb').setPointerCapture(e.pointerId);
}
function pbMove(e){
  if(P.drag){const p=svgPt(e);P.drag.t.x=Math.round(p.x-P.drag.dx);P.drag.t.y=Math.round(p.y-P.drag.dy);P.drag.el.setAttribute('transform',`translate(${P.drag.t.x},${P.drag.t.y})`)}
  else if(P.draft&&P.draft.k==='pen'){const p=svgPt(e),q=P.draft.pts[P.draft.pts.length-1];if(Math.hypot(p.x-q[0],p.y-q[1])>2.5){P.draft.pts.push([Math.round(p.x),Math.round(p.y)]);$('#pDraft').innerHTML=lineSVG(P.draft,null)}}
  else if(P.draft){const p=svgPt(e);P.draft.x2=p.x;P.draft.y2=p.y;$('#pDraft').innerHTML=lineSVG(P.draft,null)}
}
function pbUp(){
  if(P.drag){P.drag=null;return}
  if(P.draft&&P.draft.k==='pen'){const d=P.draft;P.draft=null;$('#pDraft').innerHTML='';if(d.pts.length>3){hist();P.cur.lines.push(d);drawPB()}return}
  if(P.draft){const d=P.draft;P.draft=null;$('#pDraft').innerHTML='';
    if(Math.hypot(d.x2-d.x1,d.y2-d.y1)>14){hist();['x1','y1','x2','y2'].forEach(k=>d[k]=Math.round(d[k]));P.cur.lines.push(d);drawPB()}}
}
function playFrames(){
  const F=P.cur.frames||[];if(F.length<2){toast('Save at least 2 steps first');return}
  if(P.anim)return;P.anim=true;const ref=P.cur,home=structuredClone(P.cur.tokens);
  const dur=S.settings.still?10:1100;let i=0;
  const step=()=>{
    if(P.cur!==ref){P.anim=false;return}
    if(i>=F.length-1){setTimeout(()=>{P.anim=false;if(P.cur===ref){P.cur.tokens=home;P.stepI=0;setCap();drawPB()}},1800);return}
    const a=F[i],b=F[i+1];const t0=performance.now();P.stepI=i+1;setCap();
    const fr=now=>{if(P.cur!==ref){P.anim=false;return}let k=Math.min(1,(now-t0)/dur);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      P.cur.tokens.forEach(t=>{const A=a[t.id],B=b[t.id];if(A&&B){t.x=A[0]+(B[0]-A[0])*k;t.y=A[1]+(B[1]-A[1])*k}});drawPB();
      if(k<1)requestAnimationFrame(fr);else{i++;setTimeout(step,S.settings.still?1400:1100)}};
    requestAnimationFrame(fr);
  };
  P.cur.tokens.forEach(t=>{const A=F[0][t.id];if(A){t.x=A[0];t.y=A[1]}});P.stepI=0;setCap();drawPB();setTimeout(step,400);
}

function shrinkPhoto(file,max=1000){
  if(window.createImageBitmap){return createImageBitmap(file).then(bm=>{const k=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}).catch(()=>shrinkPhoto0(file,max))}
  return shrinkPhoto0(file,max)}
function shrinkPhoto0(file,max=1000){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const MDB={_p:null,db(){return this._p||(this._p=new Promise((res,rej)=>{const r=indexedDB.open('hoop-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async tx(mode,fn){const d=await this.db();return new Promise((res,rej)=>{const t=d.transaction('m',mode),st=t.objectStore('m');const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
 put(id,b){return this.tx('readwrite',st=>st.put(b,id))},get(id){return this.tx('readonly',st=>st.get(id))},del(id){return this.tx('readwrite',st=>st.delete(id))}};

function teamData(){S.team=S.team||{name:'My Team',players:[],events:[]};

function pStats(pid){const T=teamData();let gp=0,t={min:0,pts:0,reb:0,ast:0,stl:0};
  T.events.forEach(e=>{const st=e.stats&&e.stats[pid];if(e.type==='game'&&st&&Object.values(st).some(x=>+x>0)){gp++;Object.keys(t).forEach(k=>t[k]+=(+st[k]||0))}});
  const avg=k=>gp?(t[k]/gp).toFixed(1).replace(/\.0$/,''):'–';
  let held=0,came=0;T.events.forEach(e=>{if(e.date<=todayKey()&&e.att&&e.att[pid]){held++;if(e.att[pid]==='in')came++}});
  return {gp,ppg:avg('pts'),rpg:avg('reb'),apg:avg('ast'),spg:avg('stl'),mpg:avg('min'),att:held?Math.round(came/held*100):null}}

/* ================= SEASON: end game, W/L record, analytics, trends, reports ================= */
/* --- which games count --- */
function gDone(e){return !!(e.live&&e.live.done)||!!e.result}
function gStarted(e){return !!(e.live&&e.live.started&&!e.live.done)}
function gHasStats(e){return e.type==='game'&&e.stats&&Object.values(e.stats).some(s=>s&&Object.values(s).some(v=>+v>0))}
function gScore(e){if(e.live&&e.live.log&&e.live.log.length){const c=liveCalc(e);return {us:c.us,them:c.them}}return e.score&&(e.score.us!==''||e.score.them!=='')?{us:+e.score.us||0,them:+e.score.them||0}:null}
function gResult(e){if(e.result)return e.result;const s=gScore(e);if(!s||!gDone(e))return null;return s.us>s.them?'W':s.us<s.them?'L':'T'}
function seasonGames(T){return T.events.filter(e=>e.type==='game'&&(gDone(e)||gHasStats(e))).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function recordOf(T){const r={W:0,L:0,T:0};seasonGames(T).forEach(e=>{const x=gResult(e);if(x)r[x]++});return r}
/* --- per-player numbers --- */
var STK=['pts','reb','ast','stl','blk','to','pf','fgm','fga','tpm','tpa','ftm','fta'];
function pLine(e,pid){const s=(e.stats||{})[pid];if(!s)return null;const o={};STK.forEach(k=>o[k]=+s[k]||0);
  const played=Object.values(o).some(v=>v>0)||(e.live&&((e.live.start||[]).includes(pid)||(e.live.on||[]).includes(pid)||(e.live.log||[]).some(x=>x.p===pid)));return played?o:null}
function eff(o){return o.pts+o.reb+o.ast+o.stl+o.blk-(o.fga-o.fgm)-(o.fta-o.ftm)-o.to}
function pSeason(T,pid){const G=seasonGames(T);const lines=[];G.forEach(e=>{const o=pLine(e,pid);if(o)lines.push({e,o,eff:eff(o)})});
  const t={};STK.forEach(k=>t[k]=lines.reduce((a,l)=>a+l.o[k],0));const gp=lines.length;
  const avg=k=>gp?t[k]/gp:0;const pct=(m,a)=>t[a]?t[m]/t[a]*100:null;
  return {gp,t,lines,avg,ppg:avg('pts'),rpg:avg('reb'),apg:avg('ast'),spg:avg('stl'),bpg:avg('blk'),tpg:avg('to'),fpg:avg('pf'),
    fg:pct('fgm','fga'),tp:pct('tpm','tpa'),ft:pct('ftm','fta'),effg:gp?lines.reduce((a,l)=>a+l.eff,0)/gp:0,trend:trendOf(lines.map(l=>l.eff))}}
function trendOf(v){if(v.length<3)return 0;const last=v.slice(-2),prev=v.slice(0,-2);const a=last.reduce((x,y)=>x+y,0)/last.length,b=prev.reduce((x,y)=>x+y,0)/prev.length;
  const d=a-b,th=Math.max(1.5,Math.abs(b)*.15);return d>=th?1:d<=-th?-1:0}
function triHTML(t){return t>0?'<span class="tri up" role="img" aria-label="Trending up">▲</span>':t<0?'<span class="tri dn" role="img" aria-label="Trending down">▼</span>':'<span class="tri fl" role="img" aria-label="Steady">–</span>'}
function teamSeason(T){const G=seasonGames(T);const per=G.map(e=>{const s=gScore(e)||{us:0,them:0};const t={};STK.forEach(k=>t[k]=0);
    T.players.forEach(p=>{const o=pLine(e,p.id);if(o)STK.forEach(k=>t[k]+=o[k])});
    const q=e.live&&e.live.log&&e.live.log.length?liveCalc(e):null;return {e,us:s.us,them:s.them,res:gResult(e),t,q}});
  const n=per.length;const sum=k=>per.reduce((a,g)=>a+g.t[k],0);const pc=(m,a)=>sum(a)?sum(m)/sum(a)*100:null;
  return {per,n,ppg:n?per.reduce((a,g)=>a+g.us,0)/n:0,oppg:n?per.reduce((a,g)=>a+g.them,0)/n:0,fg:pc('fgm','fga'),tp:pc('tpm','tpa'),ft:pc('ftm','fta'),
    rpg:n?sum('reb')/n:0,apg:n?sum('ast')/n:0,tpg:n?sum('to')/n:0,spg:n?sum('stl')/n:0,fpg:n?sum('pf')/n:0,rec:recordOf(T)}}
var f1=x=>x==null?'–':(Math.round(x*10)/10).toFixed(1).replace(/\.0$/,'');
var fp=x=>x==null?'–':Math.round(x)+'%';

/* --- red ring only for a started, unfinished game --- */
function liveOpenGame(){try{const T=teamData();return T.events.filter(e=>e.type==='game'&&gStarted(e)).sort((a,b)=>a.date<b.date?1:-1)[0]||null}catch(e){return null}}
navGameLive=function(){const e=liveOpenGame();if(!e)return null;const c=liveCalc(e);return c.us+'–'+c.them};
liveStart=function(){const T=teamData();if(!T.players.length){toast('Add players to the roster first');return}
  const open=liveOpenGame();if(open){openLive(open.id);return}
  const today=T.events.find(e=>e.type==='game'&&e.date===todayKey()&&!gDone(e));if(today){openLive(today.id);return}
  const e={id:uid(),type:'game',auto:1,date:todayKey(),time:'',place:'',opp:'',bring:'',att:{},stats:{}};T.events.push(e);save();openLive(e.id);toast('New game added to today')};

   <label class="small" for="lvOpp" style="display:block;margin-bottom:4px">Who did you play? (optional)</label><input id="lvOpp" value="${esc(e.opp||'')}" placeholder="Other team" style="margin-bottom:12px">

function chartBars(per){if(!per.length)return '';const W=340,H=150,pad=22,mx=Math.max(10,...per.map(g=>Math.max(g.us,g.them)));const bw=Math.min(16,(W-pad*2)/per.length/2.6);

  if(per.length<2)return '<p class="muted small">Shooting trends show up after 2 games.</p>';const W=340,H=150,pad=24;const x=i=>pad+i*(W-pad*2)/(per.length-1),y=v=>H-18-(v/100)*(H-30);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Shooting percentage by game">${[0,50,100].map(v=>`<line x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="0" y="${y(v)+3}" class="ax">${v}%</text>`).join('')}

   <div class="legend">${ser.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join('')}</div>`}

var DRILLFOR={ft:'10 free throws at the end of every practice, count makes out loud',fg:'close shots first: 20 form shots and layups before moving out',to:'two-hand pivots and jump stops before passing; "see it, then pass"',reb:'box out drill: find a body, hit, then go get the ball',ast:'pass-and-cut 3 on 0, then 3 on 2',pf:'defensive slides with hands up and feet moving, no reaching',stl:'deny the wing and read passing lanes',tp:'catch-and-shoot from the corner, feet set first'};

function autoTeam(T,TS,g){const out={facts:[],strengths:[],work:[]};

   ['#tabs [data-tab="today"]','Home','Your day starts here: today\'s plan, the next session, and a quick start button.'],

function restoreData(o){S=Object.assign(structuredClone(DEFAULT),o);S.settings=Object.assign({},DEFAULT.settings,S.settings||{});delete S.needsSetup;initProfiles();save();applySettings();buildNav();render()}
async function saveBackupFile(){const data=JSON.stringify({app:'hoop-together',v:1,at:new Date().toISOString(),data:JSON.parse(serialize())});
  const nm='hoop-together-backup-'+todayKey()+'.json';const blob=new Blob([data],{type:'application/json'});
  try{const f=new File([blob],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Hoop Together backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Backup saved to Downloads ✓')}

  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const d=o&&o.app==='hoop-together'?o.data:o;if(!d||!d.profiles)throw 0;
      restoreData(d);if(fromSetup)obClose();else closeSheet();toast('Restored: '+d.profiles.length+' profile'+(d.profiles.length>1?'s':'')+' ✓')}catch(e){toast("That file isn't a Hoop Together backup")}};r.readAsText(f)};i.click()}

var HAS_PORTRAITS=false;

var PIC_OPTS=HAS_PORTRAITS?[['auto','Auto'],['photo','Their photo'],['portrait','Number picture'],['generic','Generic'],['initials','Initials']]:[['auto','Auto'],['photo','Their photo'],['generic','Generic'],['initials','Initials']];
function pPicSrc(p,fallback){if(!p)return null;const m=p.picMode||'auto';
  if((m==='auto'||m==='photo')&&p.photo)return p.photo;
  if(HAS_PORTRAITS&&(m==='portrait'||m==='auto')){const n=parseInt(p.num,10);if(n>=1&&n<=10&&String(n)===String(p.num).trim())return `img/players/p${n}.webp`}
  if(m==='generic')return GENERIC_PIC;if(m==='initials')return null;return fallback}
pPortrait=function(p){return HAS_PORTRAITS?pPicSrc(Object.assign({},p,{photo:null,picMode:p&&p.picMode==='portrait'?'portrait':(p&&p.picMode)||'auto'}),null):null};
pAvatar=function(p,size=64){const src=pPicSrc(p,GENERIC_PIC);if(src)return `<img class="pport" src="${src}" alt="${p&&p.photo&&src===p.photo?esc(p.name):''}" style="width:100%;height:100%;object-fit:cover;object-position:50% ${src===GENERIC_PIC?'50%':'12%'};display:block">`;return `<span class="lini" style="width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background:#333;color:#fff;font-weight:800">${esc((p&&p.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`};
/* live stat cards: real photo first; otherwise initials (easier to tell kids apart than one generic picture) unless you chose something else */
faceHTML=function(p){const m=p&&p.picMode||'auto';const src=m==='auto'?(p&&p.photo||null):pPicSrc(p,null);if(src)return `<img src="${src}" alt="" loading="lazy">`;
  const nm=(p&&p.name||'?').trim();const ini=nm.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();let h=0;for(const ch of nm)h=(h*31+ch.charCodeAt(0))%360;return `<span class="lini" style="background:hsl(${h} 55% 42%)">${esc(ini)}</span>`};
const _ep23=editPlayer;editPlayer=function(id){_ep23(id);const T=teamData();const p=id?T.players.find(x=>x.id===id):null;let mode=(p&&p.picMode)||'auto';

  $$s('#fPic [data-pic]').forEach(b=>b.onclick=()=>{mode=b.dataset.pic;$$s('#fPic [data-pic]').forEach(x=>x.classList.toggle('on',x===b));prev()});
  ['#fN','#fNum'].forEach(s=>{const e=$(s);if(e)e.addEventListener('input',prev)});prev();
  const sv=$('#fSave');const old=sv.onclick;const before=T.players.length;sv.onclick=ev=>{old(ev);const T2=teamData();const pl=id?T2.players.find(x=>x.id===id):(T2.players.length>before?T2.players[T2.players.length-1]:null);if(pl){pl.picMode=mode;save();if(typeof teamRefresh==='function')teamRefresh()}}};
